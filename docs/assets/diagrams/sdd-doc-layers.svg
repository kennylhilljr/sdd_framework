<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 938' width='940' height='938' font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role='img' aria-label='Document layers'><title>Document layers</title><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a8a69e'/></marker></defs><rect width='940' height='938' fill='#ffffff'/><text x='24' y='40' font-size='17' font-weight='600' fill='#1a1a1a' text-anchor='start'>Each layer derives from the one above; IDs trace down to tests and code</text><text x='24' y='63' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Badge = owner: H human, C co-authored, A agent. Dashed boxes sit beside the stack, not in it.</text><rect x='24' y='84' width='892' height='62' rx='10' fill='#e6eefb' stroke='#2f6fd6' stroke-width='2'/><text x='44' y='110' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Constitution: AGENTS.md (H)</text><text x='44' y='131' font-size='12.5' fill='#1a1a1a' text-anchor='start'>Rules, commands and definition of done that every layer and every agent obey</text><rect x='184' y='176' width='450' height='78' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='204' y='202' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>L0 Vision and strategy</text><text x='204' y='222' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Why, for whom, multi-year outcomes</text><text x='204' y='241' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/vision/</text><rect x='586.12' y='189' width='31.8795' height='24' rx='12' fill='#e6eefb' stroke='#2f6fd6' stroke-width='1.25'/><text x='602.06' y='205.5' font-size='12.5' font-weight='600' fill='#1a1a1a' text-anchor='middle'>H</text><text x='162' y='202' font-size='13' font-weight='600' fill='#5f5e5a' text-anchor='end'>Example trace</text><path d='M409 254V279' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M634 215H668' fill='none' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='4 4'/><rect x='184' y='280' width='450' height='78' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='204' y='306' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>L1 Parent PRD</text><text x='204' y='326' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Goals, non-goals, FR index, NFRs, metrics</text><text x='204' y='345' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/prd/PRD-vN.md</text><rect x='586.12' y='293' width='31.8795' height='24' rx='12' fill='#e6eefb' stroke='#2f6fd6' stroke-width='1.25'/><text x='602.06' y='309.5' font-size='12.5' font-weight='600' fill='#1a1a1a' text-anchor='middle'>H</text><text x='162' y='324' font-size='13' fill='#1a1a1a' text-anchor='end'>FR-3</text><path d='M409 358V383' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M634 319H668' fill='none' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='4 4'/><rect x='184' y='384' width='450' height='78' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='204' y='410' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>L2 Component PRDs</text><text x='204' y='430' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Component FRs traced to parent FRs; EARS criteria</text><text x='204' y='449' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/prd/components/</text><rect x='571.337' y='397' width='46.6632' height='24' rx='12' fill='#e6eefb' stroke='#2f6fd6' stroke-width='1.25'/><text x='594.668' y='413.5' font-size='12.5' font-weight='600' fill='#1a1a1a' text-anchor='middle'>H/C</text><text x='162' y='428' font-size='13' fill='#1a1a1a' text-anchor='end'>IAM-2</text><path d='M409 462V487' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M634 423H668' fill='none' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='4 4'/><rect x='184' y='488' width='450' height='78' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='204' y='514' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>L3 SPEC, the system HLD</text><text x='204' y='534' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Architecture, data model, protocols, traceability</text><text x='204' y='553' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/spec/SPEC-vN.md</text><rect x='586.236' y='501' width='31.7636' height='24' rx='12' fill='#e6eefb' stroke='#2f6fd6' stroke-width='1.25'/><text x='602.118' y='517.5' font-size='12.5' font-weight='600' fill='#1a1a1a' text-anchor='middle'>C</text><text x='162' y='532' font-size='13' fill='#1a1a1a' text-anchor='end'>SPEC 4.2</text><path d='M409 566V591' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M634 527H668' fill='none' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='4 4'/><rect x='184' y='592' width='450' height='78' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='204' y='618' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>L4 LLD, one per component</text><text x='204' y='638' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Contracts, schema, algorithms, test plan</text><text x='204' y='657' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/lld/, docs/contracts/</text><rect x='586.361' y='605' width='31.6394' height='24' rx='12' fill='#e6eefb' stroke='#2f6fd6' stroke-width='1.25'/><text x='602.18' y='621.5' font-size='12.5' font-weight='600' fill='#1a1a1a' text-anchor='middle'>A</text><text x='162' y='636' font-size='13' fill='#1a1a1a' text-anchor='end'>LLD-iam §3</text><path d='M409 670V695' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M634 631H668' fill='none' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='4 4'/><rect x='184' y='696' width='450' height='78' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='204' y='722' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>L5 Milestone plan and tasks</text><text x='204' y='742' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Slices sized for one session, traced to IDs</text><text x='204' y='761' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/build/Mn-plan-vN.md</text><rect x='586.361' y='709' width='31.6394' height='24' rx='12' fill='#e6eefb' stroke='#2f6fd6' stroke-width='1.25'/><text x='602.18' y='725.5' font-size='12.5' font-weight='600' fill='#1a1a1a' text-anchor='middle'>A</text><text x='162' y='740' font-size='13' fill='#1a1a1a' text-anchor='end'>M2 task 4</text><path d='M409 774V799' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M634 735H668' fill='none' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='4 4'/><rect x='184' y='800' width='450' height='78' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='204' y='826' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>L6 Code, tests, handoff</text><text x='204' y='846' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Cite criteria with @spec; handoff records evidence</text><text x='204' y='865' font-size='12.5' fill='#5f5e5a' text-anchor='start'>src/, test/, docs/build/Mn-handoff-vN.md</text><rect x='586.361' y='813' width='31.6394' height='24' rx='12' fill='#e6eefb' stroke='#2f6fd6' stroke-width='1.25'/><text x='602.18' y='829.5' font-size='12.5' font-weight='600' fill='#1a1a1a' text-anchor='middle'>A</text><text x='162' y='844' font-size='13' fill='#1a1a1a' text-anchor='end'>@spec IAM-2</text><path d='M634 839H668' fill='none' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='4 4'/><rect x='668' y='176' width='248' height='182' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='5 4'/><text x='688' y='204' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Research (A)</text><text x='688' y='226' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Prior art and spikes</text><text x='688' y='245' font-size='12.5' fill='#5f5e5a' text-anchor='start'>that inform L0 to L3</text><text x='688' y='273' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/research/</text><rect x='668' y='384' width='248' height='286' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='5 4'/><text x='688' y='412' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>ADRs (C)</text><text x='688' y='434' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Decisions with options</text><text x='688' y='453' font-size='12.5' fill='#5f5e5a' text-anchor='start'>and tradeoffs; most are</text><text x='688' y='472' font-size='12.5' fill='#5f5e5a' text-anchor='start'>made at the HLD layer</text><text x='688' y='500' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Never versioned; a new</text><text x='688' y='519' font-size='12.5' fill='#5f5e5a' text-anchor='start'>ADR supersedes the old</text><text x='688' y='547' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/adr/</text><rect x='668' y='696' width='248' height='182' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='5 4'/><text x='688' y='724' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Machinery, not docs</text><text x='688' y='746' font-size='12.5' fill='#5f5e5a' text-anchor='start'>.claude/: skills, hooks</text><text x='688' y='765' font-size='12.5' fill='#5f5e5a' text-anchor='start'>tools/: spec-lint, trace-check</text><text x='688' y='784' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/trace/: audit state (derived)</text><text x='688' y='812' font-size='12.5' fill='#5f5e5a' text-anchor='start'>CI runs both checks on every PR</text><text x='24' y='914' font-size='12.5' fill='#5f5e5a' text-anchor='start'>FR and NFR live inside the PRDs, and ADRs attach where a decision is made, so neither is a layer of its own.</text></svg>
