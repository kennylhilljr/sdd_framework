<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 1040' width='940' height='1040' font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role='img' aria-label='SDD skill chain'><title>SDD skill chain</title><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a8a69e'/></marker></defs><rect width='940' height='1040' fill='#ffffff'/><text x='24' y='40' font-size='17' font-weight='600' fill='#1a1a1a' text-anchor='start'>Humans enter the chain at four points; agents do the rest</text><text x='24' y='63' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Shaded boxes are human touchpoints; every other step is an agent skill. Optional modes run behind a feature flag.</text><path d='M346 156V199' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 264V307' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 390V433' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 412H652' fill='none' stroke='#2f6fd6' stroke-width='1.25' stroke-dasharray='4 4'/><path d='M346 405L353 412L346 419L339 412z' fill='#2f6fd6'/><rect x='652' y='382' width='264' height='60' rx='8' fill='#e6eefb' stroke='#2f6fd6' stroke-width='2'/><text x='672' y='406' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Gate 1</text><text x='672' y='426' font-size='12.5' fill='#1a1a1a' text-anchor='start'>Human approves the spec</text><path d='M346 498V541' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 520H652' fill='none' stroke='#2f6fd6' stroke-width='1.25' stroke-dasharray='4 4'/><path d='M346 513L353 520L346 527L339 520z' fill='#2f6fd6'/><rect x='652' y='490' width='264' height='60' rx='8' fill='#e6eefb' stroke='#2f6fd6' stroke-width='2'/><text x='672' y='514' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Gate 2</text><text x='672' y='534' font-size='12.5' fill='#1a1a1a' text-anchor='start'>Picks ADRs, approves HLD</text><path d='M346 606V649' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 628H652' fill='none' stroke='#2f6fd6' stroke-width='1.25' stroke-dasharray='4 4'/><path d='M346 621L353 628L346 635L339 628z' fill='#2f6fd6'/><rect x='652' y='598' width='264' height='60' rx='8' fill='#e6eefb' stroke='#2f6fd6' stroke-width='2'/><text x='672' y='622' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Gate 3</text><text x='672' y='642' font-size='12.5' fill='#1a1a1a' text-anchor='start'>Reviews contracts, schema, authZ</text><path d='M346 714V757' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 840V883' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M652 124H598' fill='none' stroke='#2f6fd6' stroke-width='1.25' stroke-dasharray='4 4' marker-end='url(#arrow)'/><rect x='652' y='94' width='264' height='60' rx='8' fill='#e6eefb' stroke='#2f6fd6' stroke-width='2'/><text x='672' y='118' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Human input</text><text x='672' y='138' font-size='12.5' fill='#1a1a1a' text-anchor='start'>Answers the 12 seed questions</text><path d='M596 925H652' fill='none' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='4 4'/><rect x='652' y='895' width='264' height='60' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='5 4'/><text x='672' y='919' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>CI on every pull request</text><text x='672' y='939' font-size='12.5' fill='#5f5e5a' text-anchor='start'>spec-lint and trace-check, blocking</text><path d='M346 966V996H48V232H94' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><text x='64' y='1018' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Drift found: the spec is updated, then design and tasks regenerate</text><rect x='96' y='92' width='500' height='64' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='118' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-intake</text><text x='116' y='139' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Interviews the human with the 12 seed questions; writes brief.md</text><rect x='96' y='200' width='500' height='64' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='226' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-spec</text><text x='116' y='247' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Brief + constitution to spec.md: stories, EARS criteria, NFRs</text><rect x='96' y='308' width='500' height='82' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='334' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-clarify</text><text x='116' y='355' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Finds gaps and conflicts; optional blind divergence</text><text x='116' y='373' font-size='12.5' fill='#5f5e5a' text-anchor='start'>probe; asks the human only what is missing</text><rect x='96' y='434' width='500' height='64' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='460' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-hld</text><text x='116' y='481' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Spec to hld.md, diagrams, and ADR options with tradeoffs</text><rect x='96' y='542' width='500' height='64' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='568' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-lld</text><text x='116' y='589' font-size='12.5' fill='#5f5e5a' text-anchor='start'>One LLD per component: contracts, schema, test plan, linked IDs</text><rect x='96' y='650' width='500' height='64' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='676' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-tasks</text><text x='116' y='697' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Small, dependency-ordered tasks, each traced to requirement IDs</text><rect x='96' y='758' width='500' height='82' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='784' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-implement</text><text x='116' y='805' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Executes one task at a time, tests first;</text><text x='116' y='823' font-size='12.5' fill='#5f5e5a' text-anchor='start'>@spec on each test and entry point</text><rect x='96' y='884' width='500' height='82' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='910' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-verify</text><text x='116' y='931' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Structural trace checks, then optional</text><text x='116' y='949' font-size='12.5' fill='#5f5e5a' text-anchor='start'>blind differential; flags drift from the spec</text></svg>
