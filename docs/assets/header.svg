<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="SDD Framework: a controlled bridge from Product intent to Engineering delivery">
  <title>SDD Framework: a controlled bridge from Product intent to Engineering delivery</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1430"/>
      <stop offset="0.55" stop-color="#14306f"/>
      <stop offset="1" stop-color="#1f5bc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#7fb2ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fb2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc3ff"/>
      <stop offset="1" stop-color="#4be3b0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- left: title block -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="92" font-size="15" font-weight="600" fill="#9cc3ff" letter-spacing="3">SPEC-DRIVEN DEVELOPMENT</text>
    <text x="62" y="160" font-size="64" font-weight="800" fill="#ffffff">SDD Framework</text>
    <text x="64" y="206" font-size="22" fill="#d6e4ff">From Product intent to Engineering delivery, traced.</text>
    <text x="64" y="236" font-size="22" fill="#d6e4ff">People decide. Agents prepare. Checks keep the links.</text>

    <g transform="translate(64,272)" font-size="14" font-weight="600">
      <rect width="118" height="34" rx="17" fill="#e6eefb"/>
      <text x="59" y="22" text-anchor="middle" fill="#14306f">H  decide</text>
      <rect x="130" width="210" height="34" rx="17" fill="none" stroke="#9cc3ff" stroke-width="1.5"/>
      <text x="235" y="22" text-anchor="middle" fill="#d6e4ff">C  agent drafts, you decide</text>
      <rect x="352" width="150" height="34" rx="17" fill="none" stroke="#4be3b0" stroke-width="1.5"/>
      <text x="427" y="22" text-anchor="middle" fill="#bdf5e2">A  agent prepares</text>
    </g>
    <text x="64" y="350" font-size="14" fill="#9cb3dd">Reusable toolkit · Access Management reference profile · Node 20+, no dependencies</text>
  </g>

  <!-- right: the delivery artifact chain, threaded by IDs down to code -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" filter="url(#soft)">
    <g font-size="14" font-weight="600" fill="#ffffff">
      <rect x="700" y="40" width="250" height="34" rx="9" fill="url(#card)" stroke="#9cc3ff" stroke-opacity="0.6"/>
      <text x="716" y="62">Vision and framing</text><text x="934" y="62" text-anchor="end" fill="#e6eefb" font-size="12">H</text>

      <rect x="724" y="82" width="250" height="34" rx="9" fill="url(#card)" stroke="#9cc3ff" stroke-opacity="0.6"/>
      <text x="740" y="104">Parent PRD</text><text x="958" y="104" text-anchor="end" fill="#9cb3dd" font-size="12">FR-3</text>

      <rect x="748" y="124" width="250" height="34" rx="9" fill="url(#card)" stroke="#9cc3ff" stroke-opacity="0.6"/>
      <text x="764" y="146">Component PRD</text><text x="982" y="146" text-anchor="end" fill="#9cb3dd" font-size="12">IAM-2</text>

      <rect x="772" y="166" width="250" height="34" rx="9" fill="url(#card)" stroke="#9cc3ff" stroke-opacity="0.6"/>
      <text x="788" y="188">High level design</text><text x="1006" y="188" text-anchor="end" fill="#9cb3dd" font-size="12">4.2</text>

      <rect x="796" y="208" width="250" height="34" rx="9" fill="url(#card)" stroke="#4be3b0" stroke-opacity="0.6"/>
      <text x="812" y="230">Low level design</text><text x="1030" y="230" text-anchor="end" fill="#9cb3dd" font-size="12">§3</text>

      <rect x="820" y="250" width="250" height="34" rx="9" fill="url(#card)" stroke="#4be3b0" stroke-opacity="0.6"/>
      <text x="836" y="272">Plan</text><text x="1054" y="272" text-anchor="end" fill="#9cb3dd" font-size="12">M1-3</text>
    </g>

    <!-- code card -->
    <rect x="844" y="296" width="300" height="72" rx="11" fill="#0b1430" fill-opacity="0.85" stroke="#4be3b0" stroke-width="1.5"/>
    <text x="862" y="322" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#6f86b3">code and tests</text>
    <text x="862" y="350" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" fill="#4be3b0">// @spec IAM-2</text>
    <circle cx="1116" cy="332" r="16" fill="#4be3b0"/>
    <path d="M1108 332 l6 6 l11 -12" fill="none" stroke="#0b1430" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the thread -->
  <path d="M 690 57 C 660 120, 660 230, 700 300 S 800 345, 838 332" fill="none" stroke="url(#thread)" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  <g fill="#ffffff">
    <circle cx="690" cy="57" r="4"/>
    <circle cx="838" cy="332" r="4" fill="#4be3b0"/>
  </g>

  <!-- gate marks -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b1430">
    <g transform="translate(1180,141)"><path d="M0 -12 L12 0 L0 12 L-12 0 Z" fill="#9cc3ff"/><text y="4" text-anchor="middle">1</text></g>
    <g transform="translate(1180,183)"><path d="M0 -12 L12 0 L0 12 L-12 0 Z" fill="#9cc3ff"/><text y="4" text-anchor="middle">2</text></g>
    <g transform="translate(1180,225)"><path d="M0 -12 L12 0 L0 12 L-12 0 Z" fill="#9cc3ff"/><text y="4" text-anchor="middle">3</text></g>
    <text x="1180" y="262" text-anchor="middle" fill="#9cb3dd" font-weight="600" font-size="11">GATES</text>
  </g>
  <g stroke="#9cc3ff" stroke-opacity="0.35" stroke-dasharray="3 4">
    <line x1="1000" y1="141" x2="1166" y2="141"/>
    <line x1="1024" y1="183" x2="1166" y2="183"/>
    <line x1="1048" y1="225" x2="1166" y2="225"/>
  </g>
</svg>
